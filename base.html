{{define "base"}}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Titulo}} · Gestor de Libros</title>
<link rel="stylesheet" href="/estatico/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230891b2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/></svg>">
<script>
  // El tema se aplica ANTES de pintar para que no haya un parpadeo blanco
  // al recargar en modo oscuro.
  try {
    if (localStorage.getItem('tema') === 'oscuro') document.documentElement.classList.add('app-dark');
  } catch (e) {}
</script>
</head>
<body>

<!-- Juego de iconos: van incrustados como <symbol> para no depender de
     ninguna fuente ni recurso externo. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-libro" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-grafico" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></symbol>
  <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-buscar" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></symbol>
  <symbol id="i-lapiz" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-basura" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-alerta" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/></symbol>
  <symbol id="i-atras" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-guardar" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
  <symbol id="i-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-luna" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-etiqueta" viewBox="0 0 24 24"><path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><path d="M7.5 7.5h.01"/></symbol>
  <symbol id="i-usuarios" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/></symbol>
  <symbol id="i-archivo" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
  <symbol id="i-dinero" viewBox="0 0 24 24"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></symbol>
  <symbol id="i-rayo" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></symbol>
</svg>

<aside class="barra-lateral">
  <div class="marca">
    <span class="marca-icono"><svg class="ico"><use href="#i-libro"/></svg></span>
    <span class="marca-texto">
      <span class="marca-titulo">Gestor de Libros</span>
      <span class="marca-sub">SQLite · Go</span>
    </span>
  </div>

  <nav class="menu">
    <div class="menu-titulo">Catálogo</div>
    <a href="/" class="{{if eq .Seccion "catalogo"}}activo{{end}}">
      <svg class="ico"><use href="#i-lista"/></svg><span>Libros</span></a>
    <a href="/libro/nuevo" class="{{if eq .Seccion "nuevo"}}activo{{end}}">
      <svg class="ico"><use href="#i-mas"/></svg><span>Nuevo libro</span></a>

    <div class="menu-titulo">Análisis</div>
    <a href="/reportes" class="{{if eq .Seccion "reportes"}}activo{{end}}">
      <svg class="ico"><use href="#i-grafico"/></svg><span>Reportes</span></a>
    <a href="/auditoria" class="{{if eq .Seccion "auditoria"}}activo{{end}}">
      <svg class="ico"><use href="#i-reloj"/></svg><span>Auditoría</span></a>
  </nav>

  <div class="pie-lateral">
    Base local <strong>libros.db</strong><br>
    Sin inicio de sesión
  </div>
</aside>

<div class="contenedor">
  <header class="topbar">
    <h1>{{.Titulo}}</h1>
    <div class="topbar-espacio"></div>
    <button type="button" class="btn btn-icono" id="btn-tema" title="Cambiar tema" aria-label="Cambiar tema">
      <svg class="ico" id="ico-tema"><use href="#i-luna"/></svg>
    </button>
  </header>

  <main class="contenido">
    {{if .Aviso}}
    <div class="aviso {{if .AvisoOK}}aviso-ok{{else}}aviso-error{{end}}">
      <svg class="ico"><use href="{{if .AvisoOK}}#i-ok{{else}}#i-alerta{{end}}"/></svg>
      <span>{{.Aviso}}</span>
    </div>
    {{end}}

    {{template "contenido" .}}
  </main>
</div>

<script>
  // Modo claro / oscuro. Se guarda en localStorage: es una preferencia de
  // este navegador, no un dato de la aplicación.
  (function () {
    var raiz = document.documentElement;
    var boton = document.getElementById('btn-tema');
    var uso = document.querySelector('#ico-tema use');
    function pintar() {
      var oscuro = raiz.classList.contains('app-dark');
      uso.setAttribute('href', oscuro ? '#i-sol' : '#i-luna');
      boton.title = oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
    }
    boton.addEventListener('click', function () {
      raiz.classList.toggle('app-dark');
      try {
        localStorage.setItem('tema', raiz.classList.contains('app-dark') ? 'oscuro' : 'claro');
      } catch (e) {}
      pintar();
    });
    pintar();
  })();
</script>
</body>
</html>{{end}}
